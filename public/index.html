<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spade — DNS Security Inspector</title>
<style>
:root {
  --bg: #EDF1F7;
  --surface: #FFFFFF;
  --surface-2: #F3F6FB;
  --border: #C5D3E2;
  --text: #0C1B2C;
  --text-muted: #4A6580;
  --text-dim: #8AAAC8;
  --pass: #15884A;
  --pass-bg: #E6F5EE;
  --pass-border: #A3D9BC;
  --warn: #A06000;
  --warn-bg: #FFF3DC;
  --warn-border: #F5CB6A;
  --fail: #C22020;
  --fail-bg: #FDEAEA;
  --fail-border: #F0AAAA;
  --info: #1A5FAA;
  --info-bg: #EAF1FB;
  --loading: #5080B0;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Liberation Mono', monospace;
  --radius: 8px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090F18;
    --surface: #111C2C;
    --surface-2: #192638;
    --border: #253A52;
    --text: #C0D0E4;
    --text-muted: #5878A0;
    --text-dim: #304560;
    --pass: #28B86A;
    --pass-bg: #07200F;
    --pass-border: #1A5030;
    --warn: #E09020;
    --warn-bg: #201500;
    --warn-border: #5A3A00;
    --fail: #D83A3A;
    --fail-bg: #200808;
    --fail-border: #5A1A1A;
    --info: #4A88D8;
    --info-bg: #081525;
    --loading: #5A88C0;
  }
}

:root[data-theme="dark"] {
  --bg: #090F18;
  --surface: #111C2C;
  --surface-2: #192638;
  --border: #253A52;
  --text: #C0D0E4;
  --text-muted: #5878A0;
  --text-dim: #304560;
  --pass: #28B86A;
  --pass-bg: #07200F;
  --pass-border: #1A5030;
  --warn: #E09020;
  --warn-bg: #201500;
  --warn-border: #5A3A00;
  --fail: #D83A3A;
  --fail-bg: #200808;
  --fail-border: #5A1A1A;
  --info: #4A88D8;
  --info-bg: #081525;
  --loading: #5A88C0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 3rem 1.25rem 5rem;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

header {
  margin-bottom: 2.25rem;
}

.header-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--info);
  margin-bottom: 0.5rem;
}

h1 {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--text);
  line-height: 1.15;
  text-wrap: balance;
}

.subtitle {
  color: var(--text-muted);
  font-size: 0.875rem;
  margin-top: 0.375rem;
  line-height: 1.5;
}

.input-row {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 2rem;
}

.domain-input {
  flex: 1;
  min-width: 0;
  padding: 0.6875rem 0.9375rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.15s;
}

.domain-input:focus {
  border-color: var(--info);
  box-shadow: 0 0 0 3px var(--info-bg);
}

.domain-input::placeholder {
  color: var(--text-dim);
}

.inspect-btn {
  padding: 0.6875rem 1.375rem;
  background: var(--info);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: var(--font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.inspect-btn:hover { opacity: 0.88; }
.inspect-btn:active { opacity: 0.75; transform: scale(0.98); }
.inspect-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.results-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
  min-height: 2rem;
}

.results-domain {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-muted);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.results-domain strong {
  color: var(--text);
  font-weight: 600;
}

.summary-pills {
  display: flex;
  gap: 0.5rem;
  flex-shrink: 0;
}

.pill {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.2em 0.6em;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
}

.pill-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.pill.pass { background: var(--pass-bg); color: var(--pass); }
.pill.pass .pill-dot { background: var(--pass); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.warn .pill-dot { background: var(--warn); }
.pill.fail { background: var(--fail-bg); color: var(--fail); }
.pill.fail .pill-dot { background: var(--fail); }

.checks-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.875rem;
}

@media (max-width: 580px) {
  .checks-grid { grid-template-columns: 1fr; }
  .summary-pills { display: none; }
}

.check-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.25s;
}

.check-card.pass { border-top: 3px solid var(--pass); }
.check-card.warn { border-top: 3px solid var(--warn); }
.check-card.fail { border-top: 3px solid var(--fail); }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 0.9375rem 0.625rem;
  border-bottom: 1px solid var(--border);
}

.card-name {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.status-badge {
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.2em 0.55em;
  border-radius: 4px;
}

.status-badge.loading { color: var(--loading); background: var(--info-bg); }
.status-badge.pass { color: var(--pass); background: var(--pass-bg); }
.status-badge.warn { color: var(--warn); background: var(--warn-bg); }
.status-badge.fail { color: var(--fail); background: var(--fail-bg); }
.status-badge.error { color: var(--fail); background: var(--fail-bg); }

.card-body {
  padding: 0.75rem 0.9375rem 0.875rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.card-value {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-muted);
  word-break: break-all;
  line-height: 1.55;
  padding: 0.4375rem 0.625rem;
  background: var(--surface-2);
  border-radius: 5px;
  border: 1px solid var(--border);
  white-space: pre-wrap;
}

.card-value.empty {
  color: var(--text-dim);
  font-style: italic;
}

.card-detail {
  font-size: 0.8125rem;
  color: var(--text);
  line-height: 1.5;
}

.card-fix {
  margin-top: 0.125rem;
  padding: 0.5rem 0.625rem;
  border-radius: 5px;
  font-size: 0.75rem;
  line-height: 1.5;
}

.card-fix.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); }
.card-fix.fail { background: var(--fail-bg); border: 1px solid var(--fail-border); }

.card-fix-label {
  font-weight: 700;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.25rem;
}

.card-fix.warn .card-fix-label { color: var(--warn); }
.card-fix.fail .card-fix-label { color: var(--fail); }

.card-fix-value {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text);
}

.empty-state {
  text-align: center;
  color: var(--text-dim);
  padding: 3.5rem 0;
  font-size: 0.875rem;
  line-height: 1.6;
}

.empty-state-icon {
  font-size: 2rem;
  margin-bottom: 0.75rem;
  opacity: 0.4;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.loading-pulse { animation: pulse 1.4s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .loading-pulse { animation: none; }
}

.card-docs {
  border-top: 1px solid var(--border);
  margin-top: 0.5rem;
}

details.card-details summary {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0.5rem 0.9375rem 0.375rem;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  user-select: none;
}

details.card-details summary::-webkit-details-marker { display: none; }

details.card-details summary::after {
  content: '▾';
  font-size: 0.65rem;
  transition: transform 0.15s;
}

details.card-details[open] summary::after {
  transform: rotate(-180deg);
}

details.card-details summary:hover {
  color: var(--text-muted);
}

.doc-sections {
  padding: 0 0.9375rem 0.875rem;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.doc-section-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.2rem;
}

.doc-section-text {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.55;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-eyebrow">Security Audit</div>
    <h1>Spade</h1>
    <p class="subtitle">DNS security inspector. Checks SPF, DMARC, CAA, DNSSEC, MTA-STS, and DKIM in parallel via server-side DNS resolution.</p>
  </header>

  <div class="input-row">
    <input
      class="domain-input"
      id="domainInput"
      type="text"
      placeholder="example.com"
      spellcheck="false"
      autocapitalize="none"
      autocorrect="off"
    />
    <button class="inspect-btn" id="inspectBtn" onclick="startInspection()">Inspect</button>
  </div>

  <div id="resultsArea">
    <div class="empty-state">
      <div class="empty-state-icon">&#128274;</div>
      Enter a domain and click Inspect.
    </div>
  </div>
</div>

<script>
async function dnsQuery(name, type) {
  const url = `/resolve?name=${encodeURIComponent(name)}&type=${encodeURIComponent(type)}`;
  const resp = await fetch(url, { headers: { Accept: 'application/dns-json' } });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

function getTXTStrings(data) {
  return (data.Answer || [])
    .filter(r => r.type === 16)
    .map(r => r.data.replace(/^"|"$/g, '').replace(/" "/g, ''));
}

function esc(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

async function checkSPF(domain) {
  const data = await dnsQuery(domain, 'TXT');
  const txts = getTXTStrings(data);
  const spf = txts.find(r => r.toLowerCase().startsWith('v=spf1'));

  if (!spf) {
    return {
      status: 'fail',
      value: null,
      detail: 'No SPF record. Any sender can spoof mail from this domain.',
      fix: `v=spf1 [include your mail providers] -all`
    };
  }

  const lower = spf.toLowerCase();
  const includes = (spf.match(/include:/gi) || []).length;
  const lookupWarn = includes > 8 ? ` ${includes} includes — near the 10-lookup limit.` : '';

  if (lower.includes('-all')) {
    return { status: 'pass', value: spf, detail: `Hard fail (-all) configured.${lookupWarn}`, fix: null };
  }
  if (lower.includes('~all')) {
    return {
      status: 'warn',
      value: spf,
      detail: `Soft fail (~all) — most receivers still deliver spoofed mail.${lookupWarn}`,
      fix: 'Change ~all to -all'
    };
  }
  if (lower.includes('+all') || lower.includes('?all')) {
    return {
      status: 'fail',
      value: spf,
      detail: '+all or ?all provides zero protection — all senders are authorized.',
      fix: 'Change to -all'
    };
  }

  return {
    status: 'warn',
    value: spf,
    detail: 'SPF record found but no explicit all mechanism.',
    fix: 'Add -all at the end of the record'
  };
}

async function checkDMARC(domain) {
  const data = await dnsQuery(`_dmarc.${domain}`, 'TXT');
  const txts = getTXTStrings(data);
  const dmarc = txts.find(r => r.toLowerCase().startsWith('v=dmarc1'));

  if (!dmarc) {
    return {
      status: 'fail',
      value: null,
      detail: 'No DMARC record. No visibility into spoofing, no enforcement.',
      fix: `v=DMARC1; p=reject; sp=reject; rua=mailto:postmaster@${domain}`
    };
  }

  const pMatch = dmarc.match(/p=([^;]+)/i);
  const policy = pMatch ? pMatch[1].toLowerCase().trim() : 'none';
  const hasRua = /rua=/i.test(dmarc);

  if (policy === 'reject') {
    return {
      status: 'pass',
      value: dmarc,
      detail: `p=reject — spoofed mail rejected. ${hasRua ? 'Aggregate reports configured.' : 'No rua= tag — no visibility into failures.'}`,
      fix: hasRua ? null : `Add: rua=mailto:postmaster@${domain}`
    };
  }
  if (policy === 'quarantine') {
    return {
      status: 'warn',
      value: dmarc,
      detail: 'p=quarantine — spoofed mail goes to spam, not rejected.',
      fix: 'Escalate to p=reject once delivery is verified'
    };
  }

  return {
    status: 'fail',
    value: dmarc,
    detail: 'p=none — monitoring only. No enforcement. Spoofing not blocked.',
    fix: 'Escalate: p=none -> p=quarantine -> p=reject'
  };
}

async function checkCAA(domain) {
  const data = await dnsQuery(domain, 'CAA');
  const records = (data.Answer || []).filter(r => r.type === 257);

  if (records.length === 0) {
    return {
      status: 'warn',
      value: null,
      detail: 'No CAA records. Any public CA can issue certificates for this domain.',
      fix: `0 issue "letsencrypt.org"\n0 issuewild ";"\n0 iodef "mailto:postmaster@${domain}"`
    };
  }

  const values = records.map(r => r.data);
  const hasIodef = values.some(v => /iodef/i.test(v));
  const hasWild = values.some(v => /issuewild/i.test(v));

  const notes = [];
  if (!hasIodef) notes.push('No iodef tag — violation alerts disabled.');
  if (!hasWild) notes.push('No issuewild — wildcard issuance unrestricted.');

  const status = (!hasIodef || !hasWild) ? 'warn' : 'pass';
  const fixes = [];
  if (!hasIodef) fixes.push(`0 iodef "mailto:postmaster@${domain}"`);
  if (!hasWild) fixes.push('0 issuewild ";"');

  return {
    status,
    value: values.join('\n'),
    detail: `${records.length} CAA record${records.length > 1 ? 's' : ''} found. ${notes.join(' ')}`.trim(),
    fix: fixes.length ? fixes.join('\n') : null
  };
}

async function checkDNSSEC(domain) {
  const [dsData, adData] = await Promise.all([
    dnsQuery(domain, 'DS'),
    dnsQuery(domain, 'A')
  ]);

  const dsRecords = (dsData.Answer || []).filter(r => r.type === 43);
  const adFlag = adData.AD === true;

  if (dsRecords.length === 0) {
    const dnskeyData = await dnsQuery(domain, 'DNSKEY');
    const hasDNSKEY = (dnskeyData.Answer || []).some(r => r.type === 48);

    if (hasDNSKEY) {
      return {
        status: 'warn',
        value: 'DNSKEY present, DS missing at parent',
        detail: 'Zone is signed but DS not published at registrar — DNSSEC validation not active.',
        fix: 'Publish DS record at your registrar to complete the chain of trust'
      };
    }

    return {
      status: 'fail',
      value: null,
      detail: 'Zone not signed. DNS responses can be spoofed or poisoned.',
      fix: 'Enable DNSSEC at your DNS provider, then publish the DS record at your registrar'
    };
  }

  if (!adFlag) {
    return {
      status: 'warn',
      value: dsRecords.map(r => r.data).join('\n'),
      detail: 'DS record found but AD flag not confirmed. Chain of trust may have an issue.',
      fix: null
    };
  }

  return {
    status: 'pass',
    value: dsRecords.map(r => r.data).join('\n'),
    detail: 'DS published. AD flag confirmed — validating resolvers authenticate this zone.',
    fix: null
  };
}

async function checkMTASTS(domain) {
  const data = await dnsQuery(`_mta-sts.${domain}`, 'TXT');
  const txts = getTXTStrings(data);
  const sts = txts.find(r => r.toLowerCase().startsWith('v=stsv1'));

  if (!sts) {
    return {
      status: 'fail',
      value: null,
      detail: 'No MTA-STS record. SMTP downgrade to plaintext is undetected.',
      fix: `TXT at _mta-sts.${domain}:\nv=STSv1; id=20240101000000\n\nPolicy at https://mta-sts.${domain}/.well-known/mta-sts.txt:\nversion: STSv1\nmode: enforce\nmx: mail.${domain}\nmax_age: 86400`
    };
  }

  let policyMode = 'unreachable';
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 6000);
    const pResp = await fetch(`https://mta-sts.${domain}/.well-known/mta-sts.txt`, { signal: ctrl.signal });
    clearTimeout(tid);
    if (pResp.ok) {
      const text = await pResp.text();
      const m = text.match(/^mode:\s*(\S+)/m);
      policyMode = m ? m[1].toLowerCase() : 'unknown';
    }
  } catch (_) { /* unreachable or CORS */ }

  if (policyMode === 'enforce') {
    return { status: 'pass', value: sts, detail: 'MTA-STS active with mode: enforce. Policy file reachable.', fix: null };
  }
  if (policyMode === 'testing') {
    return {
      status: 'warn',
      value: sts,
      detail: 'MTA-STS policy in testing mode — no enforcement.',
      fix: 'Change mode: testing to mode: enforce in the policy file'
    };
  }
  if (policyMode === 'none') {
    return {
      status: 'fail',
      value: sts,
      detail: 'MTA-STS policy mode: none — explicitly disabled.',
      fix: 'Change to mode: enforce'
    };
  }

  return {
    status: 'warn',
    value: sts,
    detail: 'TXT record found but policy file unreachable at mta-sts subdomain (may be CORS-blocked — verify manually).',
    fix: `Host policy at https://mta-sts.${domain}/.well-known/mta-sts.txt`
  };
}

const DKIM_SELECTORS = [
  'google', 'default', 'selector1', 'selector2', 'mail', 'dkim',
  'k1', 'smtp', 'sg', 's1', 's2', 'key1', 'protonmail', 'mandrill',
  'mailchimp', 'amazonses', 'zoho', 'microsoft', 'sendgrid', 'em'
];

async function checkDKIM(domain) {
  const results = await Promise.allSettled(
    DKIM_SELECTORS.map(async sel => {
      const data = await dnsQuery(`${sel}._domainkey.${domain}`, 'TXT');
      const txts = getTXTStrings(data);
      const dkim = txts.find(r => /v=dkim1|p=/i.test(r));
      return dkim ? { selector: sel, value: dkim } : null;
    })
  );

  const errors = results.filter(r => r.status === 'rejected').length;
  const found = results
    .filter(r => r.status === 'fulfilled' && r.value)
    .map(r => r.value);

  if (errors === DKIM_SELECTORS.length) {
    throw new Error('All DNS queries failed — network or resolver error');
  }

  if (found.length === 0) {
    return {
      status: 'warn',
      value: null,
      detail: `No DKIM found across ${DKIM_SELECTORS.length} common selectors. Custom selector may exist, or DKIM not configured.`,
      fix: `Set up DKIM in your mail provider.\nAdd TXT at: <selector>._domainkey.${domain}`
    };
  }

  return {
    status: 'pass',
    value: found.map(f => `${f.selector}._domainkey: ${f.value.slice(0, 55)}${f.value.length > 55 ? '...' : ''}`).join('\n'),
    detail: `${found.length} DKIM selector${found.length > 1 ? 's' : ''} found: ${found.map(f => f.selector).join(', ')}.`,
    fix: null
  };
}

const DOCS = {
  spf: {
    purpose: 'Lists the mail servers authorized to send email for your domain. Receiving servers check the sender\'s IP against this list and reject or flag mail from unlisted servers.',
    implement: 'Add a TXT record at your domain root. Most mail providers give you the exact include: statement to add. End with -all to hard-fail unauthorized senders.',
    watch: 'Each include: costs one DNS lookup — you get 10 total. Exceeding this returns permerror and can break delivery for all mail. Use ~all (soft fail) during testing only, not in production.',
  },
  dmarc: {
    purpose: 'Ties SPF and DKIM together and sets a policy for what happens when both fail. Also enables aggregate reporting (rua=) so you can see who is sending as your domain before locking it down.',
    implement: 'Add a TXT record at _dmarc.yourdomain. Start with p=none and rua=mailto:you@yourdomain to collect reports without blocking anything. Once legitimate mail consistently passes, escalate to p=quarantine then p=reject.',
    watch: 'Requires SPF or DKIM — ideally both — before enforcing. p=reject without DKIM will break forwarded mail because SPF alignment fails on forward but DKIM signature survives it.',
  },
  caa: {
    purpose: 'Restricts which certificate authorities can issue TLS certificates for your domain. Without CAA, any of the 100+ public CAs can issue a cert — a significant attack surface.',
    implement: 'Add CAA records at your domain root. Use 0 issue for regular certs, 0 issuewild for wildcards, and 0 iodef for violation email alerts. Your CA\'s documentation will tell you the exact value to use.',
    watch: '0 issuewild ";" blocks all wildcard issuance including by your own CA — only add it if you don\'t use wildcard certs. Without iodef you get no notification when someone attempts unauthorized issuance.',
  },
  dnssec: {
    purpose: 'Cryptographically signs DNS records so resolvers can verify they haven\'t been tampered with or spoofed. Prevents DNS cache poisoning attacks where an attacker redirects your domain to a malicious server.',
    implement: 'Two steps: enable DNSSEC signing at your DNS provider (generates DNSKEY records), then publish the DS record at your domain registrar. Both must be in place for validation to work end-to-end.',
    watch: 'Signing the zone does nothing until the DS record exists at the parent registrar — this is the step most people miss. Verify with: dig +dnssec yourdomain and look for the ad (authenticated data) flag in the response.',
  },
  'mta-sts': {
    purpose: 'Tells sending mail servers to always use TLS when delivering to your domain and to validate your mail server\'s certificate. Prevents SMTP downgrade attacks where an attacker strips encryption in transit.',
    implement: 'Two parts: a TXT record at _mta-sts.yourdomain with v=STSv1; id=TIMESTAMP, and a policy file hosted at https://mta-sts.yourdomain/.well-known/mta-sts.txt. The mta-sts subdomain must serve valid HTTPS.',
    watch: 'Start with mode: testing — it reports violations but doesn\'t block mail. Switch to mode: enforce only after verifying delivery. A long max_age with enforce before you\'ve tested is a footgun that can silently drop mail.',
  },
  dkim: {
    purpose: 'Adds a cryptographic signature to outbound email headers. Receiving servers verify the signature against the public key in DNS. Unlike SPF, DKIM signatures survive email forwarding.',
    implement: 'Generate a key pair in your mail provider\'s settings — they give you the public key. Publish it as a TXT record at selector._domainkey.yourdomain. The selector name is chosen by your provider.',
    watch: 'DKIM is required for DMARC alignment on forwarded mail — without it, p=reject will break forwarded messages where SPF alignment fails. Rotate keys periodically and keep the old selector active for 48h after rotation.',
  },
};

const CHECKS = [
  { id: 'spf',     name: 'SPF',     run: checkSPF },
  { id: 'dmarc',   name: 'DMARC',   run: checkDMARC },
  { id: 'caa',     name: 'CAA',     run: checkCAA },
  { id: 'dnssec',  name: 'DNSSEC',  run: checkDNSSEC },
  { id: 'mta-sts', name: 'MTA-STS', run: checkMTASTS },
  { id: 'dkim',    name: 'DKIM',    run: checkDKIM },
];

let counts = { pass: 0, warn: 0, fail: 0, done: 0 };

function updateSummary() {
  document.getElementById('pillPass').textContent = counts.pass;
  document.getElementById('pillWarn').textContent = counts.warn;
  document.getElementById('pillFail').textContent = counts.fail;
  if (counts.done === CHECKS.length) {
    document.getElementById('summaryBar').style.opacity = '1';
  }
}

function renderLoading(check) {
  const card = document.getElementById(`card-${check.id}`);
  card.className = 'check-card';
  card.style.borderTop = '';
  card.innerHTML = `
    <div class="card-header">
      <span class="card-name">${check.name}</span>
      <span class="status-badge loading loading-pulse">···</span>
    </div>
    <div class="card-body">
      <div class="card-value empty loading-pulse">querying DNS…</div>
    </div>`;
}

function renderResult(check, result) {
  const card = document.getElementById(`card-${check.id}`);
  const { status, value, detail, fix } = result;
  card.className = `check-card ${status}`;

  const badge = { pass: 'Pass', warn: 'Warn', fail: 'Fail', error: 'Error' }[status] || status;
  const valueHtml = value
    ? `<div class="card-value">${esc(value)}</div>`
    : `<div class="card-value empty">no record found</div>`;

  let fixHtml = '';
  if (fix) {
    fixHtml = `<div class="card-fix ${status}">
      <div class="card-fix-label">Publish</div>
      <div class="card-fix-value">${esc(fix)}</div>
    </div>`;
  }

  const docs = DOCS[check.id];
  const docsHtml = docs ? `
    <div class="card-docs">
      <details class="card-details">
        <summary>About</summary>
        <div class="doc-sections">
          <div>
            <div class="doc-section-label">What it does</div>
            <div class="doc-section-text">${esc(docs.purpose)}</div>
          </div>
          <div>
            <div class="doc-section-label">How to implement</div>
            <div class="doc-section-text">${esc(docs.implement)}</div>
          </div>
          <div>
            <div class="doc-section-label">Watch for</div>
            <div class="doc-section-text">${esc(docs.watch)}</div>
          </div>
        </div>
      </details>
    </div>` : '';

  card.innerHTML = `
    <div class="card-header">
      <span class="card-name">${check.name}</span>
      <span class="status-badge ${status}">${badge}</span>
    </div>
    <div class="card-body">
      ${valueHtml}
      <div class="card-detail">${esc(detail)}</div>
      ${fixHtml}
    </div>
    ${docsHtml}`;

  counts[status] = (counts[status] || 0) + 1;
  counts.done++;
  updateSummary();
}

function buildResultsArea(domain) {
  document.getElementById('resultsArea').innerHTML = `
    <div class="results-header">
      <div class="results-domain">Inspecting <strong>${esc(domain)}</strong></div>
      <div class="summary-pills" id="summaryBar" style="opacity:0; transition: opacity 0.3s;">
        <div class="pill pass"><div class="pill-dot"></div><span id="pillPass">0</span> pass</div>
        <div class="pill warn"><div class="pill-dot"></div><span id="pillWarn">0</span> warn</div>
        <div class="pill fail"><div class="pill-dot"></div><span id="pillFail">0</span> fail</div>
      </div>
    </div>
    <div class="checks-grid">
      ${CHECKS.map(c => `<div class="check-card" id="card-${c.id}"></div>`).join('')}
    </div>`;
}

function cleanDomain(raw) {
  return raw.trim()
    .replace(/^https?:\/\//i, '')
    .replace(/^www\./i, '')
    .replace(/\/.*$/, '')
    .toLowerCase();
}

async function startInspection() {
  const domain = cleanDomain(document.getElementById('domainInput').value);
  if (!domain || !domain.includes('.')) {
    document.getElementById('domainInput').focus();
    return;
  }

  const btn = document.getElementById('inspectBtn');
  btn.disabled = true;
  btn.textContent = 'Inspecting…';
  counts = { pass: 0, warn: 0, fail: 0, done: 0 };
  buildResultsArea(domain);
  CHECKS.forEach(c => renderLoading(c));

  CHECKS.forEach(async check => {
    try {
      renderResult(check, await check.run(domain));
    } catch (e) {
      renderResult(check, { status: 'error', value: null, detail: `Query failed: ${e.message}`, fix: null });
    }
  });

  await Promise.allSettled(CHECKS.map(c => c.run(domain).catch(() => {})));
  btn.disabled = false;
  btn.textContent = 'Inspect';
}

document.getElementById('domainInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startInspection();
});
</script>
</body>
</html>
